<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majlis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe4; --panel: #fffdf7; --ink: #1b1a17; --muted: #6b6151; --faint: #8a7f6a;
    --line: #d9cfba; --green: #2f6b5e; --gold: #b07d1a; --red: #9c3f2d;
    --dark: #1c1a16; --dark-panel: #232019; --dark-line: #38332a; --dark-ink: #f2ebdc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Karla, system-ui, sans-serif; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; }
  button { font: inherit; cursor: pointer; }
  a { color: var(--green); }

  header.top {
    display: flex; align-items: baseline; gap: 18px; padding: 18px 32px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  header.top .brand { font-family: "Cormorant Garamond", Georgia, serif; font-size: 30px; font-weight: 700; }
  header.top .tag { color: var(--muted); font-size: 14px; flex-grow: 1; }
  .crumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .crumbs button { background: none; border: none; color: var(--green); font-weight: 600; padding: 0; }

  main { padding: 28px 32px 60px; max-width: 1400px; margin: 0 auto; }
  .screen { display: none; }
  .screen.on { display: block; }

  /* ---------- map ---------- */
  .maphead { display: flex; gap: 28px; align-items: flex-start; margin-bottom: 26px; }
  .maphead h1 { font-size: 34px; margin: 0 0 8px; font-weight: 600; }
  .lede { color: var(--muted); font-size: 16px; line-height: 1.6; max-width: 620px; }
  .provenance { flex-shrink: 0; width: 380px; background: #ece4d3; border-radius: 12px; padding: 18px 20px; }
  .provenance h3 { margin: 0 0 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.5; }
  .step b { color: var(--ink); }
  .step .n { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg);
             font-size: 11px; font-weight: 700; display: grid; place-items: center; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; text-align: left;
          display: flex; flex-direction: column; gap: 8px; transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(27,26,23,.08); }
  .card .row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card h3 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 23px; font-weight: 600; margin: 0; line-height: 1.2; }
  .pill { flex-shrink: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
          border-radius: 999px; padding: 4px 9px; border: 1px solid currentColor; }
  .pill.course { color: var(--green); } .pill.unit { color: var(--gold); } .pill.not_yet { color: var(--red); }
  .card .counts { font-size: 12.5px; color: var(--faint); }
  .card .why { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .card .cta { font-size: 13.5px; font-weight: 700; color: var(--green); margin-top: 2px; }
  .card .cta.done { color: var(--gold); }

  /* ---------- council ---------- */
  .council { background: var(--dark); color: var(--dark-ink); border-radius: 16px; padding: 22px 24px; }
  .council h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 28px; margin: 0; }
  .controls { display: flex; gap: 10px; align-items: center; margin: 16px 0 20px; flex-wrap: wrap; }
  .controls button { background: #2d2921; color: var(--dark-ink); border: 1px solid var(--dark-line); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
  .controls button.primary { background: #e0b666; color: var(--dark); border-color: #e0b666; }
  .controls button:disabled { opacity: .45; cursor: default; }
  .clock { margin-left: auto; font-size: 13px; color: #9a8f79; display: flex; gap: 18px; }
  .clock b { color: #e0b666; }

  .lanes { display: grid; grid-template-columns: 250px 1fr; gap: 16px; }
  .agents { display: flex; flex-direction: column; gap: 8px; }
  .agent { border: 1px solid var(--dark-line); border-radius: 10px; padding: 10px 12px; background: var(--dark-panel); opacity: .5; transition: opacity .2s, border-color .2s; }
  .agent.live { opacity: 1; border-color: #e0b666; background: #2b241d; }
  .agent.finished { opacity: 1; }
  .agent .nm { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .agent .mandate { font-size: 11.5px; color: #9a8f79; line-height: 1.45; margin-top: 3px; }
  .agent .meta { font-size: 10.5px; color: #7a7264; margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
  .agent .meta span { border: 1px solid var(--dark-line); border-radius: 4px; padding: 1px 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4a4438; }
  .agent.live .dot { background: #e0b666; animation: pulse 1s infinite; }
  .agent.finished .dot { background: #7faa8f; }
  @keyframes pulse { 50% { opacity: .3; } }

  .stream { background: var(--dark-panel); border: 1px solid var(--dark-line); border-radius: 12px; padding: 14px 16px; height: 460px; overflow-y: auto; }
  .ev { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid #2a251e; animation: slide .25s ease; }
  @keyframes slide { from { opacity: 0; transform: translateY(6px); } }
  .ev .t { font-size: 11px; color: #6f6759; width: 46px; flex-shrink: 0; padding-top: 2px; }
  .ev .who { font-size: 11.5px; font-weight: 700; width: 92px; flex-shrink: 0; padding-top: 2px; }
  .ev .msg { font-size: 13.5px; line-height: 1.5; color: #e6ddc9; }
  .ev .kind { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
  .k-strike { background: #4a2420; color: #f0a99a; } .k-objection { background: #4a3c1c; color: #ecd08a; }
  .k-cut { background: #3a3325; color: #d8c79a; } .k-done { background: #23402f; color: #9fd3b6; }
  .k-gap { background: #402c1c; color: #e8b98a; } .k-narrow { background: #2c3340; color: #a8c2e0; }

  /* ---------- syllabus ---------- */
  .syl { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 30px 34px; }
  .syl h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 40px; font-weight: 700; margin: 6px 0 12px; line-height: 1.1; }
  .byline { display: flex; gap: 34px; padding: 18px 0; border-top: 1px solid #ece4d3; border-bottom: 1px solid #ece4d3; margin: 18px 0 24px; }
  .byline .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .byline .v { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .unit { border-top: 1px solid #ece4d3; padding: 22px 0; }
  .unit:first-of-type { border-top: none; }
  .unit .wk { font-family: "Cormorant Garamond", Georgia, serif; font-size: 20px; font-weight: 700; color: var(--red); }
  .unit h3 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 26px; font-weight: 600; margin: 2px 0 12px; }
  .obj { font-size: 14.5px; color: var(--muted); line-height: 1.6; margin: 4px 0 4px 18px; }
  .reading { display: flex; gap: 12px; margin-top: 14px; }
  .src { flex-shrink: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 3px 8px; height: fit-content; margin-top: 2px; }
  .src.shelf { color: var(--green); } .src.outside { color: var(--red); }
  .reading .ti { font-size: 15.5px; font-weight: 600; }
  .reading .sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .note { background: #f0ece0; border-radius: 8px; padding: 11px 14px; margin-top: 8px; }
  .note .lbl { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .note .q { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 17px; color: #3d372c; margin-top: 5px; line-height: 1.5; }
  .disagree { background: #f7f3e8; border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 12px 16px; margin-top: 16px; }
  .disagree .lbl { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .disagree p { font-size: 14.5px; color: #514937; line-height: 1.6; margin: 6px 0 0; }
  .after { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .box { background: #efe8da; border-radius: 12px; padding: 18px 20px; }
  .box h4 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 21px; margin: 0 0 10px; font-weight: 600; }
  .box p, .box li { font-size: 14px; color: #514937; line-height: 1.6; }
  .struck li { margin-bottom: 8px; list-style: none; }
  .struck .st { text-decoration: line-through; color: var(--muted); }
  .struck .by { font-weight: 700; color: var(--red); font-size: 12.5px; }
  .empty { color: var(--faint); font-size: 14px; padding: 40px; text-align: center; }
  .banner { background: #ece4d3; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 13.5px; color: #514937; margin-bottom: 20px; display: flex; gap: 12px; }
  .banner b { color: var(--red); letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">Majlis</div>
  <div class="tag">A council of agents reads one library and drafts the syllabus.</div>
  <div class="crumbs" id="crumbs"></div>
</header>

<main>

<!-- ============ MAP ============ -->
<section id="screen-map" class="screen on">
  <div class="banner" id="mapBanner"></div>
  <div class="maphead">
    <div>
      <h1 class="serif">What this library can teach</h1>
      <p class="lede" id="mapLede"></p>
    </div>
    <div class="provenance">
      <h3>How these subjects were found</h3>
      <div class="steps" id="provSteps"></div>
    </div>
  </div>
  <div class="grid" id="mapGrid"></div>
</section>

<!-- ============ COUNCIL ============ -->
<section id="screen-council" class="screen">
  <div class="council">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px;">
      <h2 id="councilTitle"></h2>
      <div style="font-size:12px;color:#9a8f79" id="councilMode"></div>
    </div>
    <div class="controls">
      <button id="btnPlay" class="primary">▶ Play</button>
      <button id="btnSpeed">4×</button>
      <button id="btnSyl" style="display:none">Syllabus →</button>
      <button id="btnEnd">Skip to syllabus →</button>
      <div class="clock">
        <div>elapsed <b id="cElapsed">0.0s</b></div>
        <div>cost <b id="cCost">$0.00</b></div>
        <div>proposed <b id="cProposed">0</b></div>
        <div>struck <b id="cStruck">0</b></div>
      </div>
    </div>
    <div class="lanes">
      <div class="agents" id="agents"></div>
      <div class="stream" id="stream"></div>
    </div>
  </div>
</section>

<!-- ============ SYLLABUS ============ -->
<section id="screen-syllabus" class="screen">
  <div class="syl" id="syl"></div>
</section>

</main>

<script>
const AGENTS = [
  { id:"lead",       name:"Lead",          model:"Opus 5",   tools:"shelf",              mandate:"Split the subject into threads; later reconcile, order and write objectives" },
  { id:"researcher", name:"Researchers ×N",model:"Sonnet 5", tools:"shelf + web search", mandate:"One per thread, in parallel: propose readings and name gaps" },
  { id:"isnad",      name:"Isnad",         model:"Opus 5",   tools:"web search",         mandate:"Verify every claim about what a book covers; strike what it can't confirm" },
  { id:"counter",    name:"Counter-reader",model:"Sonnet 5", tools:"web search",         mandate:"Whose account is missing? Propose at most one addition" },
  { id:"realist",    name:"Realist",       model:"Sonnet 5", tools:"—",                  mandate:"Length, order, entry point: can a person read this in six weeks?" },
  { id:"audit",      name:"Audit",         model:"code",     tools:"—",                  mandate:"Every reading ships or has a recorded reason; quoted notes must be her words" },
];
const SPEEDS = [1, 4, 10, 40];

let MAP = null, RUNS = [], run = null, timer = null, speed = 4, cursor = 0, playing = false, tl = [];
const MAX_GAP = 4;   // seconds of silence to show before skipping ahead

// Real runs have long thinking gaps (the lead takes 47s before it says anything).
// Replay keeps the real clock but compresses dead air, so the view never looks stalled.
function timeline(events) {
  let shown = 0, last = 0;
  return events.map(e => {
    shown += Math.min(e.at - last, MAX_GAP);
    last = e.at;
    return { ...e, showAt: shown };
  });
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));

async function boot() {
  [MAP, RUNS] = await Promise.all([
    fetch("../data/map.json").then(r => r.json()),
    fetch("runs.json").then(r => r.json()).catch(() => []),
  ]);
  drawMap();
  show("map");
}

function show(name, subject) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("screen-" + name).classList.add("on");
  const crumbs = [`<button onclick="show('map')">The map</button>`];
  if (name !== "map" && subject) crumbs.push(`<span>›</span><span>${esc(subject)}</span>`);
  $("crumbs").innerHTML = crumbs.join(" ");
  window.scrollTo({ top: 0 });
}

/* ---------------- map ---------------- */
function drawMap() {
  const subjects = MAP.subjects;
  const withRun = new Set(RUNS.map(r => r.subject));
  const totals = subjects.reduce((a, s) => ({ books: a.books + s.books, read: a.read + s.read }), { books: 0, read: 0 });

  $("mapBanner").innerHTML = `<b>Prototype data</b><div>The map below is real: one pass over 756 catalogued books produced these ${subjects.length} subjects and their verdicts. Only subjects marked “syllabus ready” have a recorded council run; the rest need one.</div>`;
  $("mapLede").textContent = `837 books, 470 of them unread. The cartographer read the whole library and found ${subjects.filter(s => s.verdict === "course").length} subjects it could carry as a six-week course, ${subjects.filter(s => s.verdict === "unit").length} worth a unit, and ${subjects.filter(s => s.verdict === "not_yet").length} it declined.`;

  $("provSteps").innerHTML = [
    ["1", "<b>Catalogue.</b> Each book gets genres, themes, a mood and a description written by Claude — 756 of 837 recognised, the rest left blank rather than guessed."],
    ["2", "<b>Propose.</b> The whole library goes into one request; the model proposes subjects having seen every book, not a sample."],
    ["3", "<b>Assign, in code.</b> Books join a subject by tag, weighted by how rare the tag is on this shelf — so “nakba” carries a book in and “technology” barely moves it."],
    ["4", "<b>Judge.</b> Each subject's real books go back to the model for a verdict, the shape of what's here, the holes, and anything misfiled."],
  ].map(([n, t]) => `<div class="step"><div class="n">${n}</div><div>${t}</div></div>`).join("");

  $("mapGrid").innerHTML = subjects.map((s, i) => {
    const ready = withRun.has(s.name);
    return `<button class="card" onclick="openSubject(${i})">
      <div class="row">
        <h3>${esc(s.name)}</h3>
        <span class="pill ${s.verdict}">${s.verdict.replace("_", " ")}</span>
      </div>
      <div class="counts">${s.books} books · ${s.read} read · ${s.unread} unread${s.reviewed ? ` · ${s.reviewed} with her notes` : ""}</div>
      <div class="why">${esc(s.why_this_library || s.description)}</div>
      <div class="cta ${ready ? "" : "done"}">${ready ? "Convene the council →" : "No run yet — needs the council"}</div>
    </button>`;
  }).join("");
}

async function openSubject(i) {
  const subject = MAP.subjects[i];
  const match = RUNS.find(r => r.subject === subject.name);
  if (!match) {
    show("council", subject.name);
    $("councilTitle").textContent = subject.name;
    $("councilMode").textContent = "no recorded run";
    $("stream").innerHTML = `<div class="empty">No council run recorded for this subject yet.<br><br>With the server running, this is where the live run would start.</div>`;
    $("agents").innerHTML = "";
    return;
  }
  run = await fetch(`../runs/${match.slug}.json`).then(r => r.json());
  show("council", subject.name);
  $("councilTitle").textContent = run.syllabus.course_title || subject.name;
  $("councilMode").textContent = `recorded run · ${run.events.length} events · ${run.seconds}s · $${run.cost_usd.toFixed(2)} · lead ${run.models.lead}, workers ${run.models.workers}`;
  tl = timeline(run.events);
  resetCouncil();
  play();
}

/* ---------------- council replay ---------------- */
function resetCouncil() {
  cursor = 0; playing = false; clearInterval(timer);
  $("stream").innerHTML = "";
  $("cElapsed").textContent = "0.0s"; $("cCost").textContent = "$0.00";
  $("cProposed").textContent = "0"; $("cStruck").textContent = "0";
  $("agents").innerHTML = AGENTS.map(a => `<div class="agent" id="ag-${a.id}">
      <div class="nm">${a.name}<span class="dot"></span></div>
      <div class="mandate">${a.mandate}</div>
      <div class="meta"><span>${a.model}</span><span>${a.tools}</span></div>
    </div>`).join("");
}

function play() {
  if (!run) return;
  playing = true; $("btnPlay").textContent = "❚❚ Pause";
  clearInterval(timer);
  const end = tl[tl.length - 1].showAt;
  let clock = cursor ? tl[cursor - 1].showAt : 0;
  working(tl[cursor] ? tl[cursor].agent : null);
  timer = setInterval(() => {
    clock += 0.1 * speed;
    const frac = Math.min(1, clock / end);
    $("cElapsed").textContent = (run.seconds * frac).toFixed(1) + "s";
    $("cCost").textContent = "$" + (run.cost_usd * frac).toFixed(2);
    while (cursor < tl.length && tl[cursor].showAt <= clock) emit(tl[cursor++]);
    working(cursor < tl.length ? tl[cursor].agent : null);
    if (cursor >= tl.length) {
      clearInterval(timer); playing = false; $("btnPlay").textContent = "↻ Replay";
      document.querySelectorAll(".agent").forEach(el => el.classList.remove("live"));
    }
  }, 100);
}

// The agent whose output comes next is the one currently thinking.
function working(agentId) {
  document.querySelectorAll(".agent").forEach(el => el.classList.remove("live"));
  if (agentId) $("ag-" + agentId)?.classList.add("live");
}

function emit(e) {
  const stream = $("stream");
  const agent = AGENTS.find(a => a.id === e.agent);
  $("ag-" + e.agent)?.classList.add("finished");
  const kind = ["strike","objection","cut","done","gap","narrow"].includes(e.kind) ? `<span class="kind k-${e.kind}">${e.kind}</span>` : "";
  stream.insertAdjacentHTML("beforeend",
    `<div class="ev"><div class="t">${e.at.toFixed(1)}s</div><div class="who">${agent ? agent.name.replace(" ×N","") : e.agent}</div><div class="msg">${kind}${esc(e.text)}</div></div>`);
  stream.scrollTop = stream.scrollHeight;
  if (e.kind === "propose") $("cProposed").textContent = String(Number($("cProposed").textContent) + (e.text.match(/,/g) || []).length + 1);
  if (e.kind === "strike") $("cStruck").textContent = String(Number($("cStruck").textContent) + 1);
}

$("btnPlay").onclick = () => {
  if (!run) return;
  if (playing) { clearInterval(timer); playing = false; $("btnPlay").textContent = "▶ Play"; }
  else { if (cursor >= tl.length) resetCouncil(); play(); }
};
$("btnSpeed").onclick = () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  $("btnSpeed").textContent = speed + "×";
  if (playing) play();
};
$("btnSyl").onclick = () => drawSyllabus();
$("btnEnd").onclick = () => {
  if (!run) return;
  clearInterval(timer); playing = false;
  while (cursor < tl.length) emit(tl[cursor++]);
  working(null);
  drawSyllabus();
};

/* ---------------- syllabus ---------------- */
function drawSyllabus() {
  const s = run.syllabus;
  const shelfCount = s.units.flatMap(u => u.readings).filter(r => r.from_shelf).length;
  const total = s.units.flatMap(u => u.readings).length;
  show("syllabus", run.subject);
  $("syl").innerHTML = `
    <div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Six weeks · about five hours a week</div>
    <h1>${esc(s.course_title)}</h1>
    <p style="font-size:17px;color:#514937;line-height:1.6;max-width:860px">${esc(s.description)}</p>
    <div class="byline">
      <div><div class="k">Taught by</div><div class="v">Abeer Minhas</div></div>
      <div><div class="k">Assembled by</div><div class="v">Hudhud and the council</div></div>
      <div><div class="k">Readings</div><div class="v">${shelfCount} of ${total} from her shelf</div></div>
      <div><div class="k">This run</div><div class="v">${run.seconds}s · $${run.cost_usd.toFixed(2)}</div></div>
    </div>
    ${s.units.map(u => `
      <div class="unit">
        <div class="wk">Week ${u.week}</div>
        <h3>${esc(u.title)}</h3>
        ${u.objectives.map(o => `<div class="obj">• ${esc(o)}</div>`).join("")}
        ${u.readings.map(r => `
          <div class="reading">
            <span class="src ${r.from_shelf ? "shelf" : "outside"}">${r.from_shelf ? "Her shelf" : "Added"}</span>
            <div>
              <div class="ti">${esc(r.title)}</div>
              <div class="sub">${esc(r.author)} · ${esc(r.assign)} · ~${r.pages}pp</div>
              ${r.professors_note ? `<div class="note"><div class="lbl">The professor's note</div><div class="q">“${esc(r.professors_note)}”</div></div>` : ""}
            </div>
          </div>`).join("")}
        <div class="disagree"><div class="lbl">Where the sources disagree</div><p>${esc(u.disagreement)}</p></div>
      </div>`).join("")}
    <div class="after">
      <div class="box">
        <h4>What this syllabus doesn't cover</h4>
        <p>${esc(s.shortfall) || "—"}</p>
        ${s.objection ? `<h4 style="margin-top:16px">The counter-reader's objection</h4><p>${esc(s.objection)}</p>` : ""}
      </div>
      <div class="box">
        <h4>Struck by the council</h4>
        <ul class="struck" style="padding-left:0;margin:0">
          ${(s.struck || []).map(st => `<li><span class="st">${esc(st.title)}</span> — <span class="by">${esc(st.struck_by)}</span>: ${esc(st.reason)}</li>`).join("") || "<li>Nothing was struck.</li>"}
        </ul>
      </div>
    </div>`;
}

window.show = show; window.openSubject = openSubject;
boot();
</script>
</body>
</html>
